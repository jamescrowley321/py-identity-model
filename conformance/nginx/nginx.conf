worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    large_client_header_buffers 4 32k;

    server {
        listen 8443 ssl;
        server_name localhost.emobix.co.uk;

        ssl_certificate /certs/nginx-selfsigned.crt;
        ssl_certificate_key /certs/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_verify_client off;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 120s;

        location / {
            set $backend "http://server:8080";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;

            # Forward the negotiated TLS version + cipher of the incoming
            # connection so the suite's EnsureIncomingTls12WithSecureCipherOrTls13
            # condition (FAPI2-SP-FINAL-5.2.1) can verify it. The hosted suite's
            # apache proxy sets these; nginx must replicate them or every FAPI2
            # module warns "TLS Protocol not found". nginx negotiates TLS 1.3
            # with modern clients, which the condition accepts unconditionally.
            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # mTLS listener (FAPI 2.0 client_auth_type=mtls / sender_constrain=mtls).
    # The suite advertises its mtls_endpoint_aliases on port 8444 (BASE_MTLS_URL);
    # this block requests the client certificate and forwards it to the suite as
    # the X-Ssl-Cert header (URL-encoded PEM) that ExtractClientCertificateFrom
    # RequestHeaders reads. optional_no_ca accepts a self-signed client cert (the
    # RP registers it via jwks x5c for self_signed_tls_client_auth); the suite —
    # not nginx — validates the cert against the registered client.
    server {
        listen 8444 ssl;
        server_name localhost.emobix.co.uk;

        ssl_certificate /certs/nginx-selfsigned.crt;
        ssl_certificate_key /certs/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_verify_client optional_no_ca;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 120s;

        location / {
            set $backend "http://server:8080";
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8444;

            proxy_set_header X-Ssl-Protocol $ssl_protocol;
            proxy_set_header X-Ssl-Cipher $ssl_cipher;
            # The presented client certificate as PEM (empty when none). The
            # suite's ExtractClientCertificateFromRequestHeaders reconstructs the
            # PEM from this apache-style whitespace-folded form ($ssl_client_cert);
            # it does NOT URL-decode, so $ssl_client_escaped_cert would not parse.
            proxy_set_header X-Ssl-Cert $ssl_client_cert;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
