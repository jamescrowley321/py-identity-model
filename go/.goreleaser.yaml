# GoReleaser config for the Go library. A library has no binaries to build —
# `go get` resolves the module directly from the go/vX.Y.Z tag — so this only
# produces a GitHub Release with an autogenerated changelog. Runs from go/
# (its own module) on a go/vX.Y.Z tag.
version: 2

project_name: identity-model-go

builds:
  - skip: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^test:'
      - '^ci:'
      - '^chore:'

release:
  github:
    owner: jamescrowley321
    name: py-identity-model
  name_template: 'Go {{ .Tag }}'
  header: |
    Go library release `{{ .Tag }}`.

    ```
    go get github.com/jamescrowley321/py-identity-model/go@{{ .Tag }}
    ```
