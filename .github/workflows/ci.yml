name: CI

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      run-descope-integration:
        description: 'Run Descope integration tests'
        required: false
        type: boolean
        default: false
      run-example-tests:
        description: 'Run example integration tests'
        required: false
        type: boolean
        default: false
      run-build:
        description: 'Run build step'
        required: false
        type: boolean
        default: false
      run-ory-integration:
        description: 'Run Ory integration tests (skip in duplicate-call workflows to avoid upstream rate limits)'
        required: false
        type: boolean
        default: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Lint
        run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Unit Tests
        run: make test-unit

  fastapi-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: fastapi-identity-model typecheck + tests
        run: make test-fastapi

  integration-tests-ory:
    if: inputs.run-ory-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Integration Tests (ORY)
        run: make test-integration-ory
        env:
          TEST_DISCO_ADDRESS: ${{ secrets.TEST_DISCO_ADDRESS }}
          TEST_JWKS_ADDRESS: ${{ secrets.TEST_JWKS_ADDRESS }}
          TEST_CLIENT_ID: ${{ secrets.TEST_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.TEST_CLIENT_SECRET }}
          TEST_SCOPE: ${{ secrets.TEST_SCOPE }}
          TEST_EXPIRED_TOKEN: ${{ secrets.TEST_EXPIRED_TOKEN }}
          TEST_AUDIENCE: ${{ secrets.TEST_AUDIENCE }}

  integration-tests-descope:
    if: inputs.run-descope-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Integration Tests (Descope)
        run: make test-integration-descope
        env:
          TEST_DISCO_ADDRESS: ${{ secrets.DESCOPE_DISCO_ADDRESS }}
          TEST_JWKS_ADDRESS: ${{ secrets.DESCOPE_JWKS_ADDRESS }}
          TEST_CLIENT_ID: ${{ secrets.DESCOPE_CLIENT_ID }}
          TEST_CLIENT_SECRET: ${{ secrets.DESCOPE_CLIENT_SECRET }}
          TEST_SCOPE: ${{ secrets.DESCOPE_SCOPE }}
          TEST_EXPIRED_TOKEN: ${{ secrets.DESCOPE_EXPIRED_TOKEN }}
          TEST_AUDIENCE: ${{ secrets.DESCOPE_AUDIENCE }}

      - name: Upload token characterization (Descope)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-characterization-descope
          path: token_characterization_*.md
          if-no-files-found: ignore

  integration-tests-node-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Start node-oidc-provider fixture
        run: docker compose -f test-fixtures/node-oidc-provider/docker-compose.yml up -d --build --wait

      - name: Integration Tests (node-oidc-provider)
        run: uv run pytest src/tests -m integration --env-file=.env.node-oidc -v

      - name: Tear down node-oidc-provider fixture
        if: always()
        run: docker compose -f test-fixtures/node-oidc-provider/docker-compose.yml down

  integration-tests-keycloak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Start Keycloak fixture
        run: docker compose -f test-fixtures/keycloak/docker-compose.yml up -d --build --wait

      - name: Integration Tests (Keycloak)
        run: uv run pytest src/tests -m integration --env-file=.env.keycloak -v

      - name: Upload token characterization (Keycloak)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: token-characterization-keycloak
          path: token_characterization_*.md
          if-no-files-found: ignore

      - name: Tear down Keycloak fixture
        if: always()
        run: docker compose -f test-fixtures/keycloak/docker-compose.yml down

  integration-tests-cross-issuer:
    # Both Docker IdPs up side by side so a REAL token minted by one is rejected
    # by an RS trusting the other (true cross-issuer, not a forged mock). The
    # single-provider jobs above can't do this — they run one IdP each.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Start node-oidc-provider fixture
        run: docker compose -f test-fixtures/node-oidc-provider/docker-compose.yml up -d --build --wait

      - name: Start Keycloak fixture
        run: docker compose -f test-fixtures/keycloak/docker-compose.yml up -d --build --wait

      - name: Cross-issuer real-token rejection (node-oidc <-> Keycloak)
        run: uv run --all-packages pytest src/tests/integration/test_cross_issuer_real_idps.py -m integration -v

      - name: Tear down Keycloak fixture
        if: always()
        run: docker compose -f test-fixtures/keycloak/docker-compose.yml down

      - name: Tear down node-oidc-provider fixture
        if: always()
        run: docker compose -f test-fixtures/node-oidc-provider/docker-compose.yml down

  example-tests:
    if: inputs.run-example-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Example Integration Tests
        run: make test-examples

  build:
    if: inputs.run-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Build
        run: make build-dist

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history + the base branch tip so the mutation gate can diff
          # the changed security surface against BASE (Epic 19 G.1).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Fetch base branch for diff
        # On a pull_request the reusable workflow inherits github.base_ref;
        # on a branch push it is empty, so fall back to main. Interpolate the
        # ref into an env var (not directly into the run: script) for hygiene.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: Security gate (mutation)
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: BASE="origin/$BASE_REF" make security-gate

  load-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.13

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: make ci-setup

      - name: Load smoke (CI-short profile — real Locust vs the booted RS)
        env:
          HARNESS_SMOKE_REPORT: load-smoke-report.txt
        run: make test-harness-load

      # Per-scenario RPS/latency/gate table. Written before the gate assertions
      # run, so the artifact survives a failing gate — upload always.
      - name: Upload load-smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: load-smoke-report
          path: load-smoke-report.txt

  ci-complete:
    if: always()
    needs: [lint, unit-tests, fastapi-tests, integration-tests-ory, integration-tests-descope, integration-tests-node-oidc, integration-tests-keycloak, integration-tests-cross-issuer, example-tests, build, security-gate, load-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results=( \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-tests.result }}" \
            "${{ needs.fastapi-tests.result }}" \
            "${{ needs.integration-tests-ory.result }}" \
            "${{ needs.integration-tests-descope.result }}" \
            "${{ needs.integration-tests-node-oidc.result }}" \
            "${{ needs.integration-tests-keycloak.result }}" \
            "${{ needs.integration-tests-cross-issuer.result }}" \
            "${{ needs.example-tests.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.security-gate.result }}" \
            "${{ needs.load-smoke.result }}" \
          )
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "CI failed: found job with result '$result'"
              exit 1
            fi
          done
          echo "All CI jobs passed"
