$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'library'
language: 'python'

# Tasks shell out to uv (toolchain: 'system'); moon only caches + detects
# affected. `test` is the offline unit suite so `moon run :test` needs no
# Docker fixtures. Native flows (make lint / integration / release) are
# unchanged and remain the source of truth.
tasks:
  test:
    command: 'uv run pytest src/tests -m unit -p no:benchmark -q'
    toolchain: 'system'
    inputs:
      - 'src/**/*.py'
      - 'pyproject.toml'
  lint:
    script: 'uv run ruff check src && uv run ruff format --check src'
    toolchain: 'system'
    inputs:
      - 'src/**/*.py'
      - 'pyproject.toml'
  build:
    command: 'uv build'
    toolchain: 'system'
    inputs:
      - 'src/**/*.py'
      - 'pyproject.toml'
